name: Eclosion fragment3 pressure-zone verification

on:
  push:
    branches:
      - prototype/fragment-lab-v1

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: egg_timer
        run: flutter pub get
      - name: Format modified Dart file
        working-directory: egg_timer
        run: dart format lib/lab/fragment_scene.dart
      - name: Commit formatter output if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add egg_timer/lib/lab/fragment_scene.dart
            git commit -m "Format fragment 3 pressure-zone update"
            git push
          fi
      - name: Analyze
        working-directory: egg_timer
        continue-on-error: true
        run: flutter analyze
      - name: Coupled flight tests
        working-directory: egg_timer
        run: flutter test --no-pub test/widget_test.dart --plain-name "Vol couple:"
      - name: Full widget tests
        working-directory: egg_timer
        continue-on-error: true
        run: flutter test --no-pub test/widget_test.dart
