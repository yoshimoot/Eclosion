name: Eclosion raster baseline comparison

on:
  push:
    branches:
      - prototype/fragment-lab-v1

jobs:
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - working-directory: egg_timer
        run: flutter pub get
      - name: Current raster test
        working-directory: egg_timer
        run: flutter test --no-pub test/widget_test.dart --plain-name "Aucun basculement raster de toute la plaque a .495 ou .6"

  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cc127d61cdd332a1fe4a0417bc97f90d8efadabc
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - working-directory: egg_timer
        run: flutter pub get
      - name: Baseline raster test
        working-directory: egg_timer
        run: flutter test --no-pub test/widget_test.dart --plain-name "Aucun basculement raster de toute la plaque a .495 ou .6"
