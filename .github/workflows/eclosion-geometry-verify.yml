name: Eclosion geometry verification

on:
  push:
    branches:
      - prototype/fragment-lab-v1

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5144343011d62dff921c961a31dcb3c5e5758b7b
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: egg_timer
        run: flutter pub get
      - name: Full widget tests on pre-geometry baseline
        working-directory: egg_timer
        run: flutter test --no-pub test/widget_test.dart
